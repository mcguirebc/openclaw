name: Deploy to Cloud Run

on:
  push:
    branches:
      - deploy

concurrency:
  group: deploy-cloudrun
  cancel-in-progress: false

env:
  PROJECT_ID: fin45-483402
  REGION: us-west1
  SERVICE: openclaw-gateway
  REPO: fin45
  IMAGE: openclaw

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/751572738104/locations/global/workloadIdentityPools/github-actions/providers/github-actions-provider
          service_account: github-deploy@fin45-483402.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Submit Cloud Build
        run: |
          gcloud builds submit \
            --config=cloudbuild.yaml \
            --project=${{ env.PROJECT_ID }} \
            --substitutions=_REGION=${{ env.REGION }},_REPO=${{ env.REPO }},_IMAGE=${{ env.IMAGE }},_SERVICE=${{ env.SERVICE }}

      - name: Show service URL
        run: |
          gcloud run services describe ${{ env.SERVICE }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format='value(status.url)'
